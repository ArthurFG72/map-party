name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-ios-unsigned:
    # ExpoModulesJSI currently requires Swift tools 6.2.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect runner diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '### iOS runner diagnostics'
            echo "commit: $GITHUB_SHA"
            echo "run_id: $GITHUB_RUN_ID"
            echo "run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "runner_name: ${RUNNER_NAME:-<not-assigned>}"
            echo "runner_os: ${RUNNER_OS:-<unknown>}"
            echo "image_os: ${ImageOS:-<unknown>}"
            echo "image_version: ${ImageVersion:-<unknown>}"
            echo '--- host ---'
            sw_vers
            uname -a
            df -h .
            echo '--- toolchain ---'
            xcodebuild -version
            swift --version
            node --version
            npm --version
            echo '--- project ---'
            git status --short
            git rev-parse HEAD
            find mobile -maxdepth 2 -type f \( -name 'package.json' -o -name 'app.json' -o -name 'app.config.js' \) -print
          } > ios-runner-diagnostics.txt 2>&1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run mobile contract tests
        run: npm test -w mobile

      - name: Select compatible Xcode toolchain
        run: |
          SELECTED_XCODE=""
          if [ -d /Applications/Xcode_26.6.app ]; then
            SELECTED_XCODE=/Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.5.app ]; then
            SELECTED_XCODE=/Applications/Xcode_26.5.app
          elif [ -d /Applications/Xcode_26.4.1.app ]; then
            SELECTED_XCODE=/Applications/Xcode_26.4.1.app
          fi
          if [ -z "$SELECTED_XCODE" ]; then
            echo 'Xcode 26.4.1 or newer is required for the Swift 6.2 iOS package.' >&2
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$SELECTED_XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          SWIFT_VERSION="$(swift --version | sed -nE 's/^Apple Swift version ([0-9]+)\.([0-9]+).*/\1 \2/p' | head -n 1)"
          SWIFT_MAJOR="${SWIFT_VERSION%% *}"
          SWIFT_MINOR="${SWIFT_VERSION##* }"
          if [ -z "$SWIFT_VERSION" ] || [ "$SWIFT_MAJOR" -lt 6 ] || { [ "$SWIFT_MAJOR" -eq 6 ] && [ "$SWIFT_MINOR" -lt 2 ]; }; then
            echo "Swift 6.2 or newer is required; selected toolchain reports ${SWIFT_VERSION:-unknown}." >&2
            exit 1
          fi

      - name: Validate local CocoaPods specification
        working-directory: mobile
        run: |
          ruby -r cocoapods -e '
            spec = Pod::Specification.from_file("modules/map-party-local-transport/ios/MapPartyLocalTransport.podspec")
            abort "podspec homepage is missing" if spec.homepage.to_s.empty?
            abort "podspec source is missing" if spec.source.nil? || spec.source.empty?
            abort "podspec has no source files" if spec.source_files.empty?
            puts "Validated #{spec.name} #{spec.version}: homepage, source, and source files present"
          '

      - name: Generate iOS project
        working-directory: mobile
        run: |
          set -o pipefail
          npx expo prebuild --platform ios --non-interactive 2>&1 | tee prebuild-ios.log

      - name: Build unsigned device app
        working-directory: mobile
        env:
          EXPO_PUBLIC_SERVER_URL: https://18-228-44-32.sslip.io
        run: |
          set -o pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build-unsigned \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=MAP_PARTY_REQUIRE_NEARBY \
            build 2>&1 | tee ios/xcodebuild.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-build-log
          path: mobile/ios/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-runner-diagnostics
          path: ios-runner-diagnostics.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect complete failure diagnostics
        if: failure()
        working-directory: mobile
        shell: bash
        run: |
          {
            echo '### Complete iOS failure diagnostics'
            echo "commit: $GITHUB_SHA"
            echo "runner: $RUNNER_OS / $ImageOS"
            echo '--- toolchain ---'
            xcodebuild -version || true
            node --version || true
            npm --version || true
            echo '--- project files ---'
            find ios -maxdepth 2 -type f \( -name '*.log' -o -name 'Podfile' -o -name 'Podfile.lock' \) -print 2>/dev/null || true
            echo '--- prebuild and dependency diagnostics ---'
            if [ -f prebuild-ios.log ]; then
              grep -n -E -i 'error|failed|could not|unable|pod install|invalid|missing required' prebuild-ios.log | tail -n 100 || true
            else
              echo 'prebuild-ios.log was not created; failure occurred before iOS prebuild'
            fi
            echo '--- compiler diagnostics ---'
            if [ -f ios/xcodebuild.log ]; then
              grep -n -E -i 'error:|fatal error:|undefined symbol|SwiftEmitModule|CompileSwift|No such module|CodeSign|Provisioning|ARCHIVE FAILED|BUILD FAILED' ios/xcodebuild.log | head -n 160 || true
              echo '--- xcode log tail ---'
              tail -n 160 ios/xcodebuild.log || true
            else
              echo 'xcodebuild.log was not created'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-diagnostics
          path: |
            mobile/ios/xcodebuild.log
            mobile/ios/**/*.log
            mobile/ios/**/Podfile
            mobile/ios/**/Podfile.lock
            mobile/prebuild-ios.log
          if-no-files-found: warn
          retention-days: 14

      - name: Expose native Xcode failure summary
        if: failure()
        working-directory: mobile
        shell: bash
        run: |
          matches="$(
            {
              grep -E -i 'error:|fatal error:|undefined symbol|SwiftEmitModule|CompileSwift|No such module|CodeSign|Provisioning|ARCHIVE FAILED|BUILD FAILED' ios/xcodebuild.log | head -n 100 || true
              echo '--- last matching diagnostics ---'
              grep -E -i 'error:|fatal error:|undefined symbol|SwiftEmitModule|CompileSwift|No such module|CodeSign|Provisioning|ARCHIVE FAILED|BUILD FAILED' ios/xcodebuild.log | tail -n 40 || true
            }
          )"
          {
            echo '### Xcode native build failure (last diagnostics)'
            echo 'Inspect the first failing workflow stage and compiler or dependency diagnostics below.'
            echo '```text'
            printf '%s\n' "$matches"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Xcode diagnostic::$line"
          done <<< "$matches"

      - name: Package unsigned IPA
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find ios/build-unsigned/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf ipa-payload map-party-ios-unsigned.ipa
          mkdir -p ipa-payload/Payload
          cp -R "$APP_PATH" ipa-payload/Payload/
          (cd ipa-payload && zip -qry ../map-party-ios-unsigned.ipa Payload)
          file map-party-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-unsigned-ipa
          path: mobile/map-party-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
