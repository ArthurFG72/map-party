name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-ios-unsigned:
    # Use the stable Intel runner supported by the hosted macOS fleet.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Select compatible Xcode toolchain
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --non-interactive

      - name: Build unsigned device app
        working-directory: mobile
        env:
          EXPO_PUBLIC_SERVER_URL: https://18-228-44-32.sslip.io
        run: |
          set -o pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build-unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ios/xcodebuild.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-build-log
          path: mobile/ios/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Expose native Xcode failure summary
        if: failure()
        working-directory: mobile
        shell: bash
        run: |
          {
            echo '### Xcode native build failure (last diagnostics)'
            echo 'The JavaScript bundle and prebuild completed; the failure happened in xcodebuild.'
            echo '```text'
            grep -E -i 'error:|fatal error:|undefined symbol|SwiftEmitModule|CompileSwift|No such module|CodeSign|Provisioning|ARCHIVE FAILED|BUILD FAILED' ios/xcodebuild.log | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find ios/build-unsigned/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf ipa-payload map-party-ios-unsigned.ipa
          mkdir -p ipa-payload/Payload
          cp -R "$APP_PATH" ipa-payload/Payload/
          (cd ipa-payload && zip -qry ../map-party-ios-unsigned.ipa Payload)
          file map-party-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-unsigned-ipa
          path: mobile/map-party-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
