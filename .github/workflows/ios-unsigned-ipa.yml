name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-ios-unsigned:
    # ExpoModulesJSI currently requires Swift tools 6.2. Use the Intel
    # macOS 26 image, whose Xcode 26 toolchain provides that Swift version.
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Select compatible Xcode toolchain
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.4.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --non-interactive

      - name: Build unsigned device app
        working-directory: mobile
        env:
          EXPO_PUBLIC_SERVER_URL: https://18-228-44-32.sslip.io
        run: |
          set -o pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build-unsigned \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ios/xcodebuild.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-build-log
          path: mobile/ios/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Collect complete failure diagnostics
        if: failure()
        working-directory: mobile
        shell: bash
        run: |
          {
            echo '### Complete iOS failure diagnostics'
            echo "commit: $GITHUB_SHA"
            echo "runner: $RUNNER_OS / $ImageOS"
            echo '--- toolchain ---'
            xcodebuild -version || true
            node --version || true
            npm --version || true
            echo '--- project files ---'
            find ios -maxdepth 2 -type f \( -name '*.log' -o -name 'Podfile' -o -name 'Podfile.lock' \) -print 2>/dev/null || true
            echo '--- compiler diagnostics ---'
            if [ -f ios/xcodebuild.log ]; then
              grep -n -E -i 'error:|fatal error:|undefined symbol|SwiftEmitModule|CompileSwift|No such module|CodeSign|Provisioning|ARCHIVE FAILED|BUILD FAILED' ios/xcodebuild.log | head -n 160 || true
              echo '--- xcode log tail ---'
              tail -n 160 ios/xcodebuild.log || true
            else
              echo 'xcodebuild.log was not created'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-diagnostics
          path: |
            mobile/ios/xcodebuild.log
            mobile/ios/**/*.log
            mobile/ios/**/Podfile
            mobile/ios/**/Podfile.lock
          if-no-files-found: warn
          retention-days: 14

      - name: Expose native Xcode failure summary
        if: failure()
        working-directory: mobile
        shell: bash
        run: |
          matches="$(
            {
              grep -E -i 'error:|fatal error:|undefined symbol|SwiftEmitModule|CompileSwift|No such module|CodeSign|Provisioning|ARCHIVE FAILED|BUILD FAILED' ios/xcodebuild.log | head -n 100 || true
              echo '--- last matching diagnostics ---'
              grep -E -i 'error:|fatal error:|undefined symbol|SwiftEmitModule|CompileSwift|No such module|CodeSign|Provisioning|ARCHIVE FAILED|BUILD FAILED' ios/xcodebuild.log | tail -n 40 || true
            }
          )"
          {
            echo '### Xcode native build failure (last diagnostics)'
            echo 'The JavaScript bundle and prebuild completed; the failure happened in xcodebuild.'
            echo '```text'
            printf '%s\n' "$matches"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Xcode diagnostic::$line"
          done <<< "$matches"

      - name: Package unsigned IPA
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find ios/build-unsigned/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf ipa-payload map-party-ios-unsigned.ipa
          mkdir -p ipa-payload/Payload
          cp -R "$APP_PATH" ipa-payload/Payload/
          (cd ipa-payload && zip -qry ../map-party-ios-unsigned.ipa Payload)
          file map-party-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-unsigned-ipa
          path: mobile/map-party-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
