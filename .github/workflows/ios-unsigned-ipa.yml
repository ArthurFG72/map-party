name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build-ios-unsigned:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Select compatible Xcode toolchain
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --non-interactive

      - name: Verify native iOS transport autolinking
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          npx expo-modules-autolinking search --platform ios --json > "$RUNNER_TEMP/autolinking-ios.json"
          node -e "const fs=require('node:fs'); const modules=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const transport=modules['map-party-local-transport']; if (!transport?.config?.ios?.modules?.includes('MapPartyLocationModule')) throw new Error('MapPartyLocationModule nao foi resolvido pelo autolinking iOS');" "$RUNNER_TEMP/autolinking-ios.json"
          PLIST="$(find ios -name Info.plist -print -quit)"
          test -n "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$PLIST" >/dev/null
          grep -R -q 'MapPartyLocationModule' ios

      - name: Build unsigned device app
        working-directory: mobile
        env:
          EXPO_PUBLIC_SERVER_URL: https://18-228-44-32.sslip.io
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build-unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find ios/build-unsigned/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf ipa-payload map-party-ios-unsigned.ipa
          mkdir -p ipa-payload/Payload
          cp -R "$APP_PATH" ipa-payload/Payload/
          (cd ipa-payload && zip -qry ../map-party-ios-unsigned.ipa Payload)
          file map-party-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: map-party-ios-unsigned-ipa
          path: mobile/map-party-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
