services:
  - type: web
    name: map-party-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NODE_ENV
        value: production
      - key: MAX_ROOM_PARTICIPANTS
        value: 50
      - key: MAX_ROOMS
        value: 1000
      - key: CLIENT_ORIGIN
        value: https://map-party-api.onrender.com
      - key: EMERGENCY_PUBLIC_KEY_PEM
        sync: false
      - key: EMERGENCY_PRIVATE_KEY_PEM
        sync: false
      - key: APP_ANDROID_URL
        sync: false
      - key: APP_IOS_URL
        sync: false
      - key: EXPO_GO_URL
        sync: false
